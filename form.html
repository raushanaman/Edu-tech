<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0b1217, #3a5152);
    }

    .container{
      width: 350px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .container h2{
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .input-group{
      margin-bottom: 20px;
    }

    .input-group label{
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #444;
    }

    .input-group input{
      width: 100%;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
    }

    .input-group input:focus{
      border-color: #4facfe;
    }

    .error{
      color: red;
      font-size: 13px;
      margin-top: 5px;
    }

    button{
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4facfe;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover{
      background: #2196f3;
    }
  </style>
</head>
<body>

    <div class="container">
    <h2>Login Form</h2>

    <form id="myForm">

      <div class="input-group">
        <label>Email</label>
        <input type="text" id="email" placeholder="Enter your email">
        <div class="error" id="emailError"></div>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password">
        <div class="error" id="passwordError"></div>
      </div>

      <button type="submit">Validate</button>

    </form>

    <div id="resultMessage">There are some errors.</div>
  </div>
