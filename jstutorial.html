    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        #main {

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100%;
            background-color: rgb(29, 28, 28);
            color: wheat;
            gap: 30px;
        }

        /* input{

        #btn {
            padding: 12px;
            background-color: rgb(16, 74, 74);
            color: white;
            font-weight: 600;
            border-radius: 5px;
        }

        input {
            display: block;
        }

        .card {
            width: 300px;
            padding: 20px;
            border: 2px solid greenyellow;
            border-radius: 10px;
            position: relative;
            background-color: #222;
            color: white;
            min-height: 220px;
        }

        .profile-pic {
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            top: 15px;
            left: 15px;
            overflow: hidden;

        }
        .profile-pic img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            margin-top: 80px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    </style>
</head>
